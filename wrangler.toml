# wrangler.toml — Pronote API Gateway
#
# Changements majeurs par rapport à la version précédente :
#  - Cloudflare KV SUPPRIMÉ (cohérence à terme, 1 écriture/s/clé, pas de
#    transaction : c'était la cause des réponses en plusieurs minutes)
#  - Durable Object à backend SQLite ajouté (cohérence forte, disponible sur
#    le plan Workers Free)
#  - `GITHUB_API_TOKEN = ""` retiré : une variable vide était *falsy* et
#    déclenchait le repli vers un PAT codé en dur dans worker.js (fuite)
#  - Tous les secrets passent par `wrangler secret put` et n'apparaissent
#    jamais dans ce fichier, qui est public

name = "pronote-api"
main = "worker/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# --- Durable Objects -------------------------------------------------------
# Instance unique, fortement cohérente : file d'attente de jobs, résultats,
# heartbeat du runner et limitation de débit. Mono-thread par construction,
# donc aucune opération lecture-modification-écriture concurrente.
[[durable_objects.bindings]]
name = "JOB_STORE"
class_name = "JobStore"

[[migrations]]
tag = "v1-add-jobstore"
new_sqlite_classes = ["JobStore"]

# --- Variables NON sensibles ----------------------------------------------
# Les secrets (GITHUB_TOKEN, RUNNER_TOKEN, API_KEYS) se configurent avec :
#   wrangler secret put GITHUB_TOKEN
#   wrangler secret put RUNNER_TOKEN
#   wrangler secret put API_KEYS
[vars]
# Domaines autorisés en Cross-Origin. Vide = même origine uniquement.
# Jamais "*" : l'ancienne version autorisait n'importe quel site à lire les
# résultats, qui contiennent les notes d'un élève.
ALLOWED_ORIGINS = ""

# Suffixes de domaines acceptés pour pronoteUrl / entUrl (protection SSRF).
# Vide = tout domaine public HTTPS, hors adresses réseau internes.
ALLOWED_HOST_SUFFIXES = "index-education.net,ent.seine-et-marne.fr"

# Budget d'attente synchrone avant bascule en réponse 202 + jobId.
SYNC_WAIT_MS = "25000"

# Établissement par défaut si l'appelant n'en fournit pas.
DEFAULT_PRONOTE_URL = "https://0771068t.index-education.net/pronote/eleve.html"
DEFAULT_ENT_URL = "https://ent.seine-et-marne.fr/"

# Numéro d'issue utilisé UNIQUEMENT pour des diagnostics assainis (jamais de
# mot de passe, jamais de note d'élève). Laisser vide pour désactiver.
GITHUB_FALLBACK_ISSUE = ""
GITHUB_OWNER = "JeanHug"
GITHUB_REPO = "Pronote-API"

# --- Observabilité ---------------------------------------------------------
# Absente de la version précédente : impossible de diagnostiquer une panne.
[observability]
enabled = true

# --- Limites ---------------------------------------------------------------
# On reste sous les quotas du plan Workers Free, et on s'assure qu'aucun
# emballement ne peut faire exploser la facture ou les quotas :
#   - le Worker ne fait qu'UNE sous-requête externe (dispatch GitHub), le
#     reste passe par le Durable Object (quota interne, plus élevé)
#   - 30 s de CPU maximum par invocation, très au-dessus des besoins réels
[limits]
cpu_ms = 30000
