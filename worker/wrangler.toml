name = "pronote-api"
main = "index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false
send_metrics = false
tsconfig = "tsconfig.json"

[vars]
GITHUB_OWNER = "JeanHug"
GITHUB_REPO = "Pronote-API"
# Open API. The Worker answers `Access-Control-Allow-Origin: *` on every
# public route, so any website, page or application can call it from a
# browser. Credentials are sent as JSON fields, never as cookies, so no
# `Access-Control-Allow-Credentials` is emitted and `*` is safe here.
# This variable is kept for compatibility; the code no longer restricts origins.
ALLOWED_ORIGINS = "*"

[[durable_objects.bindings]]
name = "COORDINATOR"
class_name = "Coordinator"

[[migrations]]
tag = "v1-add-jobstore"
new_sqlite_classes = ["JobStore"]

[[migrations]]
tag = "v5-rebuild"
deleted_classes = ["JobStore"]
new_sqlite_classes = ["Coordinator"]

[triggers]
crons = []

[observability]
enabled = true
head_sampling_rate = 0.1
