name: Pronote 5-Hour Ephemeral Runner

on:
  workflow_dispatch:
  repository_dispatch:
    types: [start_runner]
  # Filet de sécurité uniquement : le runner se relaie lui-même quatre minutes
  # avant sa fin. Six heures évitent que le cron tue une session de 4 h 57.
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: pronote-5h-runner-single
  # Le remplaçant attend la sortie propre de son prédécesseur au lieu de tuer
  # ses jobs en vol. L'ancienne valeur `true` provoquait les annulations en série.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pronote-runner:
    name: Pronote 5h Ephemeral Runner
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      WORKER_URL: https://pronote-api.hugdu77777.workers.dev
      RUNNER_TOKEN: ${{ secrets.RUNNER_TOKEN || secrets.GH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Vérifier le token runner sans l'afficher
        shell: bash
        run: |
          [ -n "$RUNNER_TOKEN" ] || { echo '::error::RUNNER_TOKEN et GH_TOKEN sont absents.'; exit 1; }

      - name: Cache Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-chrome-${{ hashFiles('package-lock.json') }}

      - name: Dépendances système Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Installation reproductible et Chromium
        run: |
          npm ci
          npx puppeteer browsers install chrome

      - name: Démarrer la session éphémère
        run: npx tsx pronote-standalone-runner/runner.ts
