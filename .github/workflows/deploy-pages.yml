name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/pronote/schema.ts"
      - "worker/docs.ts"
      - "scripts/build-docs.ts"
      - "README.md"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-doc
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installation reproductible sans Chromium
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Générer la documentation depuis le schéma
        run: npm run build:docs

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Téléverser la documentation statique
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
