name: Pronote browser service v5
on:
  workflow_dispatch:
  repository_dispatch:
    types: [pronote_runner_v5]
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: pronote-browser-v5
  cancel-in-progress: false
jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v5
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-pronote-v5-chrome-${{ hashFiles('package-lock.json') }}
      - name: Install browser system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libdbus-1-3 libcups2 libxkbcommon0 libasound2t64 libgbm1 libcairo2 libpango-1.0-0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libatspi2.0-0
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npx puppeteer browsers install chrome
      - name: Serve isolated extractions (260 minutes maximum)
        env:
          WORKER_URL: https://pronote-api.hugdu77777.workers.dev
          RUNNER_TOKEN: ${{ secrets.RUNNER_TOKEN }}
          # Optional French egress used ONLY for EduConnect (Ministry IdP blocks datacenter IPs).
          # Format: http://user:pass@host:port — the local ENT77 path never uses it.
          EDUCONNECT_PROXY: ${{ secrets.EDUCONNECT_PROXY }}
        run: npx tsx scripts/runner.ts
