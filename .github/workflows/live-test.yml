name: Test live Pronote v4

on:
  workflow_dispatch:
    inputs:
      publier_reponse:
        description: "Publier la réponse API complète sur l’issue publique #1"
        required: true
        type: choice
        default: oui
        options: [oui, non]

permissions:
  contents: read
  issues: write

concurrency:
  group: pronote-live-test
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_BASE: https://pronote-api.hugdu77777.workers.dev
      ENT_ID: ${{ secrets.ENT_ID }}
      ENT_PASS: ${{ secrets.ENT_PASS }}
      PUBLIER_REPONSE: ${{ inputs.publier_reponse || 'oui' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Vérifier les secrets ENT sans les afficher
        shell: bash
        run: |
          [ -n "$ENT_ID" ] || { echo '::error::Secret requis absent : ENT_ID'; exit 1; }
          [ -n "$ENT_PASS" ] || { echo '::error::Secret requis absent : ENT_PASS'; exit 1; }

      - name: Installer le moteur et Chromium
        run: |
          npm ci
          npx puppeteer browsers install chrome

      - name: Extraction réelle et appel API
        run: npx tsx scripts/live-test.ts

      - name: Publier le résultat autorisé sans l'écrire dans les logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "$PUBLIER_REPONSE" = 'oui' ] && [ -f rapports/reponse-complete.json ]; then
            npx tsx scripts/publish-response.ts rapports/reponse-complete.json
          elif [ -f rapports/rapport-public.json ]; then
            npx tsx scripts/publish-response.ts rapports/rapport-public.json
          else
            echo '::error::Aucun rapport disponible à publier.'
            exit 1
          fi

      - name: Archiver uniquement le rapport assaini
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rapport-live-assaini
          path: rapports/rapport-public.json
          if-no-files-found: warn
          retention-days: 7
